name: Build, test, and smoke check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_scope:
        description: Choose what to run
        required: true
        type: choice
        options:
          - application
          - tests
          - all
        default: all

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_scope == 'tests' || inputs.run_scope == 'all' }}
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Package application without tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_scope == 'application' }}
        run: mvn --batch-mode --no-transfer-progress package -Dmaven.test.skip=true

      - name: Start application and check health
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_scope == 'application' || inputs.run_scope == 'all') }}
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:github-actions;DB_CLOSE_DELAY=-1
        run: |
          app_jar=$(find target -maxdepth 1 -name '*.jar' ! -name '*.original' -print -quit)
          java -jar "$app_jar" > app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/actuator/health; then
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done

          cat app.log
          exit 1

name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      start_application:
        description: Start the application and check its health after tests
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Start application and check health
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.start_application }}
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:github-actions;DB_CLOSE_DELAY=-1
        run: |
          app_jar=$(find target -maxdepth 1 -name '*.jar' ! -name '*.original' -print -quit)
          java -jar "$app_jar" > app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/actuator/health; then
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done

          cat app.log
          exit 1

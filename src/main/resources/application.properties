spring.application.name=api-health-platform
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/api-health;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

monitoring.interval-ms=300000
monitoring.connect-timeout-ms=3000
monitoring.read-timeout-ms=5000
monitoring.daily-report-cron=0 5 0 * * *